<!doctype html><html><head><style>body{margin:0;background:#fff}</style>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
</head><body><script type="module">
import * as THREE from 'three';
import {LDrawLoader} from 'three/addons/loaders/LDrawLoader.js';
import {LDrawConditionalLineMaterial} from 'three/addons/materials/LDrawConditionalLineMaterial.js';
const q=new URLSearchParams(location.search);
const W=+(q.get('w')||1400),H=+(q.get('h')||1000);
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setSize(W,H);renderer.setClearColor(0xf4f4f4);document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.add(new THREE.AmbientLight(0xffffff,1.3));
const dl=new THREE.DirectionalLight(0xffffff,2.2);dl.position.set(1,2,1.5);scene.add(dl);
const dl2=new THREE.DirectionalLight(0xffffff,0.8);dl2.position.set(-1.5,0.5,-1);scene.add(dl2);
const cam=new THREE.PerspectiveCamera(30,W/H,1,100000);
const loader=new LDrawLoader();loader.setConditionalLineMaterial(LDrawConditionalLineMaterial);
loader.setPartsLibraryPath('/ldraw/');
window.errors=[];
await loader.preloadMaterials('/ldraw/LDConfig.ldr');
const mtxt=await (await fetch(q.get('m'))).text();
loader.parse(mtxt,g=>{
  g.rotation.x=Math.PI;scene.add(g);g.updateMatrixWorld(true);
  window.model=g;
  const box=new THREE.Box3().setFromObject(g);window.bbox=[box.min.toArray(),box.max.toArray()];
  window.setView=(az,el,dist,tx,ty,tz,fov)=>{
    const c=box.getCenter(new THREE.Vector3());const s=box.getSize(new THREE.Vector3()).length();
    // Ziel + Azimut in LDraw-Koordinaten (az=0: Kamera auf LDraw +z = Front)
    const t=new THREE.Vector3(tx==null?c.x:tx, ty==null?c.y:-ty, tz==null?c.z:-tz);
    const d=(dist||1)*s*1.9; const a=(az+180)*Math.PI/180,e=el*Math.PI/180;
    cam.fov=fov||30;cam.updateProjectionMatrix();
    cam.position.set(t.x+d*Math.cos(e)*Math.sin(a),t.y+d*Math.sin(e),t.z+d*Math.cos(e)*Math.cos(a));
    cam.up.set(0,1,0); if(el>=89.9) cam.up.set(0,0,-1);
    cam.lookAt(t);renderer.render(scene,cam);return true;};
  window.done=true;
},e=>{window.errors.push(String(e));window.done=true;});
</script></body></html>
